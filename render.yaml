services:
  - type: web
    name: cricoracle
    runtime: node
    plan: free
    buildCommand: npm install --include=dev && ./node_modules/.bin/tsc
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Required: embeddings are OpenAI-only, so retrieval needs this key
      # even when answers are generated by Claude.
      - key: OPENAI_API_KEY
        sync: false
      # Primary answer provider. Absent = OpenAI answers instead (degraded,
      # not broken). ANTHROPIC_BASE_URL is optional and defaults to the
      # official API.
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      # Indexing bypasses RLS and requires the service-role key.
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Required before POST /crawl will run at all (fails closed).
      - key: CRAWL_SECRET
        sync: false
      - key: NODE_ENV
        value: production
